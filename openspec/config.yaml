schema: spec-driven

# Project context: được chèn vào mọi artifact OpenSpec.
context: |
  Ngôn ngữ: viết toàn bộ nội dung artifact bằng tiếng Việt. Giữ nguyên tiếng Anh cho tiêu đề
  cấu trúc OpenSpec (## Why, ## What Changes, ## Capabilities, ## Impact, ## ADDED/MODIFIED/
  REMOVED Requirements, ### Requirement:, #### Scenario:, WHEN/THEN) và từ khóa SHALL/MUST.

  Stack:
  - Next.js 16 (App Router), React 19, TypeScript, Tailwind CSS v4, Zod 4; Node >= 22.12.
  - Vitest + Testing Library (unit, test cạnh file nguồn), Playwright (e2e); alias @/* -> src/*.

  Codemap (capability -> thư mục -> file chính):
  - catalog  -> src/features/catalog/ -> catalog-service.ts
  - cart     -> src/features/cart/ -> cart-reducer.ts, cart-store.ts, use-cart.ts
  - checkout -> src/features/checkout/ -> pricing.ts, checkout-schema.ts, components/checkout-form.tsx
  - orders   -> src/features/orders/ -> order-service.ts, order-repository.ts, order-errors.ts, server.ts
  - layout   -> src/components/layout/ (+ src/app/layout.tsx) -> header.tsx, footer.tsx, nav-links.tsx

  Ràng buộc quan trọng nhất:
  1. Giá, phí ship, số tiền giảm, tổng tiền luôn do server tính; placeOrderSchema chỉ nhận
     productId + quantity (+ couponCode), không bao giờ thêm trường tiền từ client.
  2. Giỏ hàng: mỗi sản phẩm tối đa MAX_QUANTITY_PER_ITEM = 10 và không vượt stock
     (getMaxQuantity); sản phẩm stock <= 0 không thêm được.
  3. Phí ship chỉ tính trong pricing.ts: standard 30_000, express 60_000; standard miễn phí
     khi subtotal >= FREE_SHIPPING_THRESHOLD = 500_000; giỏ rỗng phí = 0.
  4. Hủy đơn chỉ khi status === "pending", ngược lại INVALID_STATUS_TRANSITION (409). Lỗi API
     luôn dạng { error: { code, message, details? } }; mã mới thêm vào OrderErrorCode + HTTP_STATUS_BY_CODE.
  5. Ranh giới: logic nghiệp vụ ở src/features/, src/app/ chỉ mỏng; không import orders/server,
     data/coupons, coupon-service hay node:* vào Client Component; đơn hàng chỉ qua OrderRepository.

  Chi tiết (quy ước code, testing, Definition of Done): xem AGENTS.md ở gốc repo.

# Per-artifact rules
rules:
  proposal:
    - Luôn có mục "## Ngoài phạm vi" liệt kê rõ những gì change này không làm.
  specs:
    - Mỗi requirement có ít nhất một scenario cho trường hợp lỗi hoặc giá trị biên, ngoài happy path.
  design:
    - Liệt kê file tạo mới/sửa, nhóm theo capability trong codemap (catalog, cart, checkout, orders, layout, ...), ghi đường dẫn đầy đủ từ gốc repo.
  tasks:
    - Mỗi nhóm task kết thúc bằng một task viết/cập nhật test cho nhóm đó.
    - Task cuối cùng là chạy `npm run check` và phải pass.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
